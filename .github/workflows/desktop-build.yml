name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Desktop builds never report to production telemetry.
  DSH_TELEMETRY_DISABLED: '1'
  # CI runners have no signing identity.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--mac dmg zip'
            artifact: desktop-macos
          - os: windows-latest
            args: '--win nsis portable'
            artifact: desktop-windows
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Stage desktop outside the monorepo
        run: node -e "require('node:fs').cpSync('desktop', process.env.RUNNER_TEMP + '/desktop', { recursive: true })"

      - name: Install desktop dependencies
        working-directory: ${{ runner.temp }}/desktop
        run: npm ci

      - name: Build installers
        working-directory: ${{ runner.temp }}/desktop
        run: npx electron-builder ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/desktop/release/*.dmg
            ${{ runner.temp }}/desktop/release/*.zip
            ${{ runner.temp }}/desktop/release/*.exe
          if-no-files-found: ignore
